<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Qarzdaftar login</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
</head>

<body
    class="min-h-screen bg-gradient-to-br from-violet-600 via-blue-600 to-cyan-500 flex items-center justify-center p-4">
    <div class="w-full max-w-md bg-white/95 backdrop-blur-md border border-white/40 rounded-3xl shadow-2xl p-8">
        <div class="text-center mb-6">
            <h1 class="text-3xl font-bold text-slate-800">Qarzdaftar</h1>
            <p class="mt-2 text-sm text-slate-500">Iltimos, tizimga kirish uchun ma’lumotlaringizni kiriting</p>
        </div>

        <div class="space-y-5">
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-2" for="email">Login</label>
                <input id="login" name="login" type="text" required
                    class="w-full rounded-xl border border-slate-300 px-4 py-3 focus:outline-none focus:ring-2 focus:ring-cyan-400 focus:border-transparent"
                    placeholder="Login kiriting" />
            </div>

            <div>
                <label class="block text-sm font-medium text-slate-700 mb-2" for="password">Parol</label>
                <input id="password" name="password" type="password" required
                    class="w-full rounded-xl border border-slate-300 px-4 py-3 focus:outline-none focus:ring-2 focus:ring-cyan-400 focus:border-transparent"
                    placeholder="Parolingizni kiriting" />
            </div>

            <!-- <div class="flex items-center justify-between text-sm text-slate-500">
                <label class="inline-flex items-center gap-2">
                    <input id="remember" type="checkbox" name="remember"
                        class="rounded border-slate-300 text-cyan-600 focus:ring-cyan-500" />
                    Esda saqlash
                </label>
                <a href="#" class="text-cyan-600 hover:text-cyan-700">Parolni unutdingizmi?</a>
            </div> -->

            <button id="kirish_btn" onclick="login()"
                class="w-full rounded-xl bg-gradient-to-r from-cyan-500 to-blue-500 text-white font-semibold py-3 shadow-lg shadow-cyan-500/30 hover:from-cyan-400 hover:to-blue-400 transition">Kirish</button>

        </div>

        <p class="mt-6 text-center text-sm text-slate-500">Yangi foydalanuvchi? <a href="#"
                class="font-medium text-cyan-600 hover:text-cyan-700">Ro‘yxatdan o‘tish</a></p>
    </div>
    <script src="./login.js"></script>
</body>

</html>
