<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Qarzdaftar</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
</head>

<body class="bg-[url('../imgs/background.jpg')]  bg-repeat bg-scroll bg-scroll bg-cover bg-no-repeat relative">
    <div class="fixed inset-0 bg-black/40 pointer-events-none"></div>

    <div class=" relative z-10">
        <div class="grid grid-cols-5  h-screen fixed w-full">
            <div class="col-span-1  ">
                <div class="w-72 h-screen bg-[#122669] p-4 flex flex-col gap-2 shadow-2xl">

                    <div class="px-4 py-6 mb-4 border-b border-white/10">
                        <h1 class="text-white text-xl font-bold tracking-wider flex items-center">
                            <span
                                class="w-12 h-12 rounded-lg mr-3 flex items-center justify-center shadow-[0_0_15px_rgba(6,182,212,0.5)]">
                                <img src="../imgs/logo.png" alt="Logo">
                            </span>
                            ADMIN PANEL
                        </h1>
                    </div>

                    <a id="home" href="#"
                        class="group relative flex items-center w-full h-12 px-4 bg-white/10 text-white rounded-xl border-l-4 border-cyan-400 shadow-lg shadow-cyan-500/20 transition-all duration-300">
                        <i class="fas fa-home w-6 text-cyan-400 group-hover:scale-110"></i>
                        <span class="ml-3 font-medium">Asosiy sahifa</span>
                        <div class="absolute right-4 w-2 h-2 bg-cyan-400 rounded-full animate-pulse"></div>
                    </a>
                    <a id="admin" href="#"
                        class="group flex items-center w-full h-12 px-4 text-blue-200/70 hover:text-white hover:bg-white/5 rounded-xl border-l-4 border-transparent hover:border-blue-400/50 transition-all duration-300">
                        <i class="fas fa-users-cog w-6 group-hover:text-blue-300 group-hover:scale-110"></i>
                        <span class="ml-3 font-medium">Admin</span>
                        <i class="fas fa-chevron-right ml-auto text-[10px] opacity-0 group-hover:opacity-50"></i>
                    </a>

                    <a id="client" href="#"
                        class="group flex items-center w-full h-12 px-4 text-blue-200/70 hover:text-white hover:bg-white/5 rounded-xl border-l-4 border-transparent hover:border-blue-400/50 transition-all duration-300">
                        <i class="fas fa-users w-6 group-hover:text-blue-300 group-hover:scale-110"></i>
                        <span class="ml-3 font-medium">Clientlar</span>
                        <i class="fas fa-chevron-right ml-auto text-[10px] opacity-0 group-hover:opacity-50"></i>
                    </a>
                    <div class="mt-auto pt-4 border-t border-white/10">
                        <button onclick="logaut()" class="flex items-center w-full h-12 px-4 
                       text-red-400 hover:text-white hover:bg-red-500/20 
                       rounded-xl transition-all duration-300">
                            <i class="fas fa-sign-out-alt w-6"></i>
                            <span class="ml-3 font-medium">Chiqish</span>
                        </button>
                    </div>

                </div>
            </div>
            <div
                class="col-span-4  backdrop-blur-xs rounded-3xl shadow-2xl p-6 m-4 h-screen touch-pan-x overflow-auto text-white">
                <div id="statistic" class="hidden bg-danger-900 w-full overflow-auto max-h-full">
                    
                    <div id="admin_page" class="mt-5 mb-5 w-100% mr-4">

                        <h1 class="text-2xl font-bold mt-10 ml-10 mb-7">Admin Malumotlari</h1>
                        <table class="w-full table-fixed border-collapse border border-gray-300">
                            <thead>
                                <tr>
                                    <th class="border border-gray-300 px-4 py-2">ID</th>
                                    <th class="border border-gray-300 px-4 py-2">Name</th>
                                    <th class="border border-gray-300 px-4 py-2">Telefon</th>
                                    <th class="border border-gray-300 px-4 py-2">Password</th>
                                    <th class="border border-gray-300 px-4 py-2">Roles</th>
                                </tr>
                            </thead>
                            <tbody id="adminstatistic" class="break-words">
                            </tbody>
                        </table>
                    </div>

                    <div id="client_page" name="clientlar malumotlari" class="mt-5 mb-5 w-100% mr-4">
                        <h1 class="text-2xl font-bold mt-10 ml-10 mb-7">Clientlar Malumotlari</h1>
                        <table class="w-full table-fixed border-collapse border border-gray-300">
                            <thead>
                                <tr>
                                    <th class="border border-gray-300 px-4 py-2">ID</th>
                                    <th class="border border-gray-300 px-4 py-2">Name</th>
                                    <th class="border border-gray-300 px-4 py-2">Telefon</th>
                                    <th class="border border-gray-300 px-4 py-2">Created At</th>
                                </tr>
                            </thead>
                            <tbody id="clentstatistic" class="break-words">
                            </tbody>
                        </table>
                    </div>
                </div>

            </div>
        </div>
    </div>
    <script src="./admin.js"></script>
</body>

</html>
